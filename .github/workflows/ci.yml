name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check credential-free preview
        run: python skills/unisender-go/scripts/unisender_go.py call system/info --dry-run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Scan for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|dist|__pycache__|\.local)/' > /tmp/secrets.json
          python -c "import json; r = json.load(open('/tmp/secrets.json')); assert not r['results'], 'Secret scan found potential credentials; inspect the affected files locally.'"
